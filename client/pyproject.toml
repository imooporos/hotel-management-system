[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-client"
version = "1.0.0"
description = "Кроссплатформенный клиент для информационной системы управления гостиницей"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.25.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
